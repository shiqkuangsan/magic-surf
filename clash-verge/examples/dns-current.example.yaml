# Optional proxy-bound DNS policy example; not a device snapshot.
# This is an example to adapt, not a complete replacement for private DNS settings.
# Retain device-local nameserver-policy, fake-ip-filter and bootstrap resolvers.
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: false
  direct-nameserver-follow-policy: true
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 节点选择'
    - 'https://8.8.8.8/dns-query#🚀 节点选择'
  direct-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://1.12.12.12/dns-query#DIRECT'
